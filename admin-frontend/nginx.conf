server {
    listen 80;
    # IPv6 обязателен: дефолт nginx:alpine слушал и [::]:80, а healthcheck
    # контейнера ходит на http://localhost, который резолвится в ::1.
    # Без этой строки healthcheck падал и контейнер помечался unhealthy.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API админки на backend внутри docker-сети.
    # Админ-панель обращается только к /admin/*, но /health полезен для отладки.
    location ~ ^/(admin|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
