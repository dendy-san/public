# Универсальный docker-compose.yml для dev и prod
# Режим определяется переменной ENVIRONMENT в .env (dev/prod)
#
# БЕЗОПАСНОСТЬ ПО УМОЛЧАНИЮ: наружу не публикуется ничего, кроме 80/443.
# Прошлый сервер был заблокирован хостером именно из-за "6379:6379" —
# Redis без пароля оказался доступен из интернета. Поэтому:
#   - у redis, backend и фронтов здесь НЕТ секции ports;
#   - доступ к ним только из внутренней сети public-network;
#   - вход снаружи — через reverse-proxy (Caddy, docker-compose.prod.yml);
#   - локальная разработка получает порты через docker-compose.override.yml
#     (файл не попадает в git, см. docker-compose.override.yml.example).
#
# Запуск dev:  cp docker-compose.override.yml.example docker-compose.override.yml
#             docker compose up --build
# Запуск prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # Redis: кэш, параметры W/Price, лимиты запросов, история снимков
  redis:
    image: redis:7-alpine
    container_name: public-redis${DEPLOY_ID:+-${DEPLOY_ID}}
    # requirepass обязателен: Redis хранит параметры услуги и счётчики
    # лимитов, а доступ к нему извне позволяет как читать данные, так и
    # использовать сервер для сканирования чужих сетей.
    # Формула с условием, а не --requirepass "${REDIS_PASSWORD}": пустая
    # строка в requirepass трактуется Redis неоднозначно, поэтому при
    # пустом пароле флаг просто не добавляется (это допустимо только dev).
    command: >
      sh -c 'if [ -n "$REDIS_PASSWORD" ]; then
      exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD";
      else exec redis-server --appendonly yes; fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - public-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Backend сервис (FastAPI) - ГИБРИДНЫЙ РЕЖИМ LLM
  # Режим переключается через переменную ENVIRONMENT в .env (dev/prod)
  # start.sh автоматически выберет uvicorn (dev) или gunicorn (prod)
  backend:
    image: public-backend:${UNIQUE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: public-backend${DEPLOY_ID:+-${DEPLOY_ID}}
    # ports не публикуем: к API обращаются через reverse-proxy фронта (nginx
    # внутри контейнера frontend) и через Caddy. Прямой доступ по 8000 наружу
    # обошёл бы CORS, лимиты запросов и будущий TLS.
    environment:
      # Пароль Redis подставляется в URL; пустой REDIS_PASSWORD даёт
      # redis://:@redis:6379/0, что redis-py трактует как "без пароля".
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # База лежит на volume, а не внутри контейнера: на слое образа SQLite
      # теряется при пересоздании контейнера, а в ней персональные данные.
      # Переопределяет DB_PATH из .env (секция environment приоритетнее).
      - DB_PATH=/data/sessions.db
      # ENVIRONMENT берётся из .env (dev для разработки, prod для production)
    volumes:
      - sqlite-data:/data
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Веб-интерфейс клиента (React + Vite + Nginx)
  # nginx внутри контейнера раздаёт SPA и проксирует /llm, /payment, /session
  # на backend:8000 — поэтому фронту не нужен опубликованный порт API.
  frontend:
    image: public-frontend:${UNIQUE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: public-frontend${DEPLOY_ID:+-${DEPLOY_ID}}
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Админ-панель (React + Vite + Nginx)
  admin-frontend:
    image: public-admin-frontend:${UNIQUE_TAG:-latest}
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: public-admin-frontend${DEPLOY_ID:+-${DEPLOY_ID}}
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis-data:
  # Персональные данные клиентов: база должна переживать пересоздание
  # контейнера и пересборку образа.
  sqlite-data:

networks:
  public-network:
    driver: bridge
