name: Deploy to VPS

# Пайплайн: собрать образы на GitHub Runner → выложить в GHCR → сказать
# серверу скачать и запустить.
#
# Прежняя версия собирала образы прямо на VPS и перед сборкой выполняла
# git reset --hard, docker system prune -a --volumes и удаление всего из
# /var/lib/docker. Это ломало деплой двумя способами:
#   1. Сборка Vite на 1.9 ГБ ОЗУ завершалась OOM-kill'ом.
#   2. "--volumes" вместе с docker volume prune удалял том с SQLite, то есть
#      персональные данные клиентов, при каждом проблемном прогоне.
# Здесь сервер только скачивает готовые образы и ничего не удаляет.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Два параллельных деплоя на один сервер мешают друг другу: второй
  # обрывает запущенный compose up. Очередь — по одному за раз.
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: dendy-san
  DEPLOY_DIR: /opt/genpost

jobs:
  build-and-push:
    name: Собрать и выложить образы
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Метки образов
        id: meta
        run: |
          SHORT=$(git rev-parse --short=7 HEAD)
          echo "tag=sha-$SHORT" >> "$GITHUB_OUTPUT"
          echo "Собираем с тегом sha-$SHORT"

      - uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Каждый образ собирается отдельным шагом: слои кэша (npm ci, pip install)
      # переиспользуются между прогонами, поэтому сборка занимает минуты, а не
      # десятки минут, и не зависит от состояния сервера.
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/public-backend:${{ steps.meta.outputs.tag }},${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/public-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/public-frontend:${{ steps.meta.outputs.tag }},${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/public-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: admin-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          file: admin-frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/public-admin-frontend:${{ steps.meta.outputs.tag }},${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/public-admin-frontend:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

  deploy:
    name: Деплой на VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Копирование конфигов
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # На сервер уходит только конфигурация запуска. Исходный код на
          # сервер не клонируется: он лежит в образах из GHCR, а на диске
          # сервера не появляется копия репозитория, которую можно прочитать
          # при компрометации.
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p $DEPLOY_DIR"
          scp -o StrictHostKeyChecking=accept-new \
            docker-compose.yml docker-compose.prod.yml Caddyfile .env.example \
            "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/"
          scp -o StrictHostKeyChecking=accept-new deploy.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/deploy.sh"
          ssh "$VPS_USER@$VPS_HOST" "chmod +x $DEPLOY_DIR/deploy.sh"

      - name: Вход в GHCR на сервере
        # Контекст secrets недоступен в условии if на уровне шага (только в
        # env и with), поэтому проверка перенесена внутрь run.
        #
        # Шаг опционален: если пакеты сделаны публичными, сервер скачивает
        # образы без логина и переменная может быть не задана.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "GHCR_PULL_TOKEN не задан — пропускаю (подходит для публичных пакетов)"
            exit 0
          fi
          # Токен передаётся по stdin, а не как аргумент команды: иначе он
          # засветился бы в выводе ps на сервере и в логе шага.
          printf '%s' "$GHCR_PULL_TOKEN" | ssh "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Деплой
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          # Без -t: CI-ключ на сервере добавлен с опцией no-pty, поэтому
          # запрос псевдотерминала завершился бы ошибкой.
          ssh "$VPS_USER@$VPS_HOST" "IMAGE_TAG=$IMAGE_TAG $DEPLOY_DIR/deploy.sh" || {
            echo "::error::Деплой завершился ошибкой — смотри логи шага и $DEPLOY_DIR/deploy.log на сервере"
            exit 1
          }

      - name: Проверка доступности
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          # Проверяем, что сайт отвечает по HTTPS. Если домен не задан в
          # переменных репозитория — пропускаем (первый деплой до DNS).
          if [ -z "$SITE_DOMAIN" ]; then
            echo "SITE_DOMAIN не задан — проверка пропущена"
            exit 0
          fi
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$SITE_DOMAIN/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "https://$SITE_DOMAIN/ отвечает 200"
              exit 0
            fi
            echo "попытка $i: код $code, ждём 10с"
            sleep 10
          done
          echo "::error::https://$SITE_DOMAIN/ не отвечает 200 за 200 секунд"
          exit 1
