server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все неизвестные пути отдаём index.html (React Router / одностраничник).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API на backend внутри docker-сети. Пути совпадают с
    # префиксами роутеров FastAPI (/llm, /payment, /session, /health),
    # поэтому переписывания URL не требуется. Фронт ходит по относительным
    # путям и не зависит от имени/порта бэкенда.
    #
    # /admin здесь НЕТ намеренно: админ-панель живёт на своём поддомене и
    # проксируется через admin-frontend/nginx.conf. Оставляя /admin на
    # клиентском домене, мы отдавали бы адрес панели вместе с адресом сайта.
    location ~ ^/(llm|payment|session|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Согласование с долгим анализом сайта (LLM): таймауты должны быть
        # не меньше клиентских (axios 300с) и Gunicorn (timeout 300с),
        # иначе nginx вернёт 502 раньше, чем завершится генерация.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Статические ассеты Vite (хэшированные имена) — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
